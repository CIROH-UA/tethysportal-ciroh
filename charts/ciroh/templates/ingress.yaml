{{- if .Values.ingresses.enabled -}}
{{- $fullName := include "ciroh.fullname" . -}}
{{- $ext := .Values.ingresses.external -}}
{{- $redirectHost := .Values.s3Static.cloudfrontDomain -}}
{{- $redirectOn := and $ext.staticRedirect.enabled $redirectHost -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "ciroh.labels" . | nindent 4 }}
  {{- if or $ext.annotations $redirectOn }}
  annotations:
    {{- with $ext.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $redirectOn }}
    alb.ingress.kubernetes.io/actions.static-redirect: '{"type":"redirect","redirectConfig":{"host":"{{ $redirectHost }}","protocol":"HTTPS","port":"443","statusCode":"HTTP_301"}}'
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ $ext.className | default "nginx" | quote }}
  {{- if $ext.tls }}
  tls:
    {{- range $ext.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range $ext.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $redirectOn }}
            - path: {{ $ext.staticRedirect.path | default "/static" }}
              pathType: Prefix
              backend:
                service:
                  name: static-redirect
                  port:
                    name: use-annotation
          {{- end }}
          {{- range .paths }}
            - path: {{ .path }}
              pathType: {{ .pathType }}
              backend:
                service:
                  name: {{ .backend.service.name }}
                  port:
                    {{- with .backend.service.port.name }}
                    name: {{ . }}
                    {{- else }}
                    number: {{ .backend.service.port.number }}
                    {{- end }}
          {{- end }}
  {{- end }}
{{- end }}
