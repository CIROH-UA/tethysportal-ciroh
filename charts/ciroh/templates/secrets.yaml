apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ciroh.fullname" . }}-secrets
  labels:
{{ include "ciroh.labels" . | indent 4 }}
type: Opaque
stringData:
  TETHYS_SECRET_KEY: {{ .Values.secrets.tethysSecretKey | quote }}
  TETHYS_DB_PASSWORD: {{ .Values.secrets.tethysDbPassword | default .Values.postgis.postgres_password | quote }}
  TETHYS_PS_CONNECTION: {{ printf "%s:%s@%s:5432" .Values.postgis.postgres_user .Values.postgis.postgres_password .Values.postgis.fullnameOverride | quote }}
  {{- with .Values.secrets.hydroshareClientId }}
  HYDROSHARE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.hydroshareSecretId }}
  HYDROSHARE_SECRET_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcRsaPrivateKey }}
  OIDC_RSA_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.csesAccessKeyId }}
  CSES_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
