{{- if .Values.dask.enabled }}
{{- $scheduler := printf "%s-dask" (include "ciroh.fullname" .) -}}
apiVersion: kubernetes.dask.org/v1
kind: DaskCluster
metadata:
  name: {{ $scheduler }}
  labels:
{{ include "ciroh.labels" . | indent 4 }}
spec:
  idleTimeout: 0
  scheduler:
    service:
      type: ClusterIP
      selector:
        dask.org/cluster-name: {{ $scheduler }}
        dask.org/component: scheduler
      ports:
        - name: tcp-comm
          port: 8786
          protocol: TCP
          targetPort: tcp-comm
        - name: http-dashboard
          port: 8787
          protocol: TCP
          targetPort: http-dashboard
    spec:
    {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . }}
    {{- end }}
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["dask", "scheduler"]
          ports:
            - name: tcp-comm
              containerPort: 8786
              protocol: TCP
            - name: http-dashboard
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: tcp-comm
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dask.scheduler.resources | nindent 12 }}
  worker:
    replicas: 0
    spec:
    {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . }}
    {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              ln -sf /config/portal_config.yml "${TETHYS_HOME}/portal_config.yml" 2>/dev/null || true
              export FIMSERV_ROOT=/scratch/fimserve
              mkdir -p "$FIMSERV_ROOT"
              exec dask worker "tcp://{{ $scheduler }}-scheduler.{{ .Release.Namespace }}.svc.cluster.local:8786" \
                --nworkers 1 --nthreads 1 \
                --memory-limit {{ .Values.dask.worker.memoryLimit | default "8GiB" | quote }} \
                --local-directory /scratch \
                --preload tethysapp.fimserve_viewer.dask_worker
          env:
            {{- include "ciroh.tethysEnv" . | nindent 12 }}
          volumeMounts:
            - name: portal-config
              mountPath: /config
              readOnly: true
            - name: scratch
              mountPath: /scratch
          resources:
            {{- toYaml .Values.dask.worker.resources | nindent 12 }}
      volumes:
        - name: portal-config
          configMap:
            name: {{ include "ciroh.fullname" . }}-portal-config
        - name: scratch
          emptyDir: {}
    {{- with .Values.dask.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
---
apiVersion: kubernetes.dask.org/v1
kind: DaskAutoscaler
metadata:
  name: {{ $scheduler }}
  labels:
{{ include "ciroh.labels" . | indent 4 }}
spec:
  cluster: {{ $scheduler }}
  minimum: 0
  maximum: {{ .Values.dask.autoscaler.maximum | default 3 }}
{{- end }}
