apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ciroh.fullname" . }}
  labels:
{{ include "ciroh.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ciroh.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ciroh.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/portal-config: {{ include (print $.Template.BasePath "/portal-config.yaml") . | sha256sum }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      initContainers:
        - name: wait-tethys-postgresdb
          image: postgis/postgis:16-3.4
          env:
            - name: PGHOST
              value: {{ .Values.postgis.fullnameOverride | quote }}
            - name: PGUSER
              value: {{ .Values.postgis.postgres_user | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgis.postgres_password | quote }}
            - name: PGDATABASE
              value: postgres
          args:
            - /bin/bash
            - -c
            - |
              while ! psql -c 'select 1' > /dev/null 2>&1; do
                echo "waiting for the database server to be ready"
                sleep 2
              done
              echo "database server is ready"
        - name: provision-store-dbs
          image: postgis/postgis:16-3.4
          env:
            - name: PGHOST
              value: {{ .Values.postgis.fullnameOverride | quote }}
            - name: PGUSER
              value: {{ .Values.postgis.postgres_user | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgis.postgres_password | quote }}
          args:
            - /bin/bash
            - -c
            - |
              psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              SELECT 'CREATE DATABASE {{ .Values.tethys.env.TETHYS_DB_NAME.value }} OWNER {{ .Values.tethys.env.TETHYS_DB_USERNAME.value }}'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.tethys.env.TETHYS_DB_NAME.value }}')\gexec
              SELECT 'CREATE DATABASE tethysdash_primary_db OWNER {{ .Values.tethys.env.TETHYS_DB_USERNAME.value }}'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'tethysdash_primary_db')\gexec
              SQL
              echo "databases provisioned"
        - name: tethys-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/init-tethys.sh"]
          env:
            {{- include "ciroh.tethysEnv" . | nindent 12 }}
          volumeMounts:
            - name: tethys-persist
              mountPath: /home/tethys/persist
            - name: portal-config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "ciroh.tethysEnv" . | nindent 12 }}
          ports:
            - name: asgi
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tethys-persist
              mountPath: /home/tethys/persist
            - name: portal-config
              mountPath: /config
              readOnly: true
          {{- range .Values.tethys.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- with .subPath }}
              subPath: {{ . }}
              {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: tethys-persist
              mountPath: /persist
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tethys-persist
          persistentVolumeClaim:
            claimName: tethys-persist-pvc
        - name: portal-config
          configMap:
            name: {{ include "ciroh.fullname" . }}-portal-config
        - name: nginx-config
          configMap:
            name: {{ include "ciroh.fullname" . }}-nginx-config
        {{- range .Values.tethys.volumes }}
          - name: {{ .name }}
            {{- with .persistentVolumeClaim }}
            persistentVolumeClaim:
              claimName: {{ .claimName }}
            {{- end }}
            {{- with .configMap }}
            configMap:
              name: {{ .name }}
            {{- end }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
