apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ciroh.fullname" . }}
  labels:
{{ include "ciroh.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
    {{- if eq .Values.strategy "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ciroh.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ciroh.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/portal-config: {{ include (print $.Template.BasePath "/portal-config.yaml") . | sha256sum }}
    spec:
    {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . }}
    {{- end }}
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "ciroh.tethysEnv" . | nindent 12 }}
          ports:
            - name: asgi
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tethys-persist
              mountPath: /home/tethys/persist
            - name: portal-config
              mountPath: /config
              readOnly: true
          {{- range .Values.tethys.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- with .subPath }}
              subPath: {{ . }}
              {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: nginx
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: tethys-persist
              mountPath: /persist
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tethys-persist
          persistentVolumeClaim:
            claimName: tethys-persist-pvc
        - name: portal-config
          configMap:
            name: {{ include "ciroh.fullname" . }}-portal-config
        - name: nginx-config
          configMap:
            name: {{ include "ciroh.fullname" . }}-nginx-config
        {{- range .Values.tethys.volumes }}
          - name: {{ .name }}
            {{- with .persistentVolumeClaim }}
            persistentVolumeClaim:
              claimName: {{ .claimName }}
            {{- end }}
            {{- with .configMap }}
            configMap:
              name: {{ .name }}
            {{- end }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
