namespace:
  enabled: false
  name: cirohportal
  limits:
    cpu: '8'
    memory: 16Gi
    ephemeral_storage: '10Gi'
  requests:
    memory: 16Gi
    ephemeral_storage: '20Gi'

image:
  repository: 'awiciroh/tethysapp-ciroh-portal'
  tag: dev_latest
  pullPolicy: 'Always'

secrets:
  existingSecretName: ciroh-portal-secrets

s3Static:
  bucket: ciroh-portal-assets
  region: us-east-1
  cloudfrontDomain: ciroh-portal-assets.s3.us-east-1.amazonaws.com
  endpointUrl: ''

serviceAccount:
  name: ciroh-portal
  roleArn: arn:aws:iam::456531024327:role/ciroh-portal-irsa

# Run the provision job as a pre-upgrade hook so a local `helm upgrade` is
# self-contained (migrate -> publish-static -> link -> syncstores). The CI
# helm_deploy path applies the provision job separately and passes
# `--set provisionJob.enabled=false` on its own `helm upgrade` to avoid
# double-running it.
provisionJob:
  enabled: true
  asHook: true

externalDatabase:
  host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
  port: 5432
  adminUser: tethys_super

ingresses:
  enabled: true
  external:
    enabled: true
    className: 'alb'
    annotations:
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=4000
    staticRedirect:
      enabled: true
    hosts:
      - host: tethys.ciroh.org
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: cirohportal-prod
                port:
                  name: http
    tls: []

tethys:
  env:
    PUBLIC_PORTAL_PROTOCOL:
      value: 'https'
    TETHYS_DB_NAME:
      value: tethys_platform
    TETHYS_DB_PORT:
      value: '5432'
    TETHYS_DB_USERNAME:
      value: tethys_default
    FIMSERV_ROOT:
      value: /home/tethys/persist/fimserve
    FIMSERVE_CACHE_MAX_GB:
      value: '3'
    ASGI_PROCESSES:
      value: '1'
    CLIENT_MAX_BODY_SIZE:
      value: 1024M

# Prod: DEBUG off -> start-server.sh runs uvicorn (static served from S3, not the dev server).
# values.yaml defaults DEBUG to true for local/k3d; this deep-merge override flips it for prod.
portalConfig:
  settings:
    DEBUG: false

valkey:
  enabled: true

postgis:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 6Gi

nodeSelector: {}
tolerations: []
affinity: {}

ephemeralStorage:
  className: gp2
  size: 10Gi

strategy: RollingUpdate

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
