namespace:
  enabled: false
  name: cirohportal
  limits:
    cpu: '8'
    memory: 16Gi
    ephemeral_storage: '10Gi'
  requests:
    memory: 16Gi
    ephemeral_storage: '20Gi'

image:
  repository: 'gioelkin/tethysapp-ciroh-portal'
  tag: dev_latest
  pullPolicy: 'Always'

secrets:
  existingSecretName: ciroh-portal-secrets

s3Static:
  bucket: ciroh-portal-assets
  region: us-east-1
  cloudfrontDomain: ciroh-portal-assets.s3.us-east-1.amazonaws.com
  endpointUrl: ''

serviceAccount:
  name: ciroh-portal
  roleArn: arn:aws:iam::456531024327:role/ciroh-portal-irsa

ingresses:
  enabled: true
  external:
    enabled: true
    className: 'alb'
    annotations:
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=4000
    hosts:
      - host: tethys.ciroh.org
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: cirohportal-prod
                port:
                  name: http
    tls: []

tethys:
  workspace_size: '16Gi'
  env:
    PUBLIC_PORTAL_PROTOCOL:
      value: 'https'
    TETHYS_DB_NAME:
      value: tethys_platform
    TETHYS_DB_PORT:
      value: '5432'
    TETHYS_DB_USERNAME:
      value: tethys_default
    FIMSERV_ROOT:
      value: /home/tethys/persist/fimserve
    FIMSERVE_CACHE_MAX_GB:
      value: '3'
    ASGI_PROCESSES:
      value: '4'
    CLIENT_MAX_BODY_SIZE:
      value: 1024M
    HERO_TEXT:
      value: 'Welcome to the CIROH Portal'
    BLURB_TEXT:
      value: 'CIROH Tethys platform provides access to a suite of pre-built applications commonly used by the Cooperative Institute for Research to Operations in Hydrology (CIROH) research community. CIROH is a national consortium of science and services partnered with the National Oceanic and Atmospheric Administration''s (NOAA) National Water Center. It aims to advance water prediction - the forecasting of streamflow, extreme events such as floods and droughts, and water quality - and enhance the communitys ability to deal with water-related challenges. This platform works through Amazon Web Services'
    FEATURE_1_HEADING:
      value: 'Tethys Platform'
    FEATURE_1_BODY:
      value: 'Tethys was piloted by implementing web portals for partners of the CIROH and Brigham Young University (BYU). It includes a suite of free, open-source software and is powered by the Django Python web framework.'
    FEATURE_2_HEADING:
      value: Applications
    FEATURE_2_BODY:
      value: 'Tethys is a mega-platform that hosts applications for hydrological and meteorological forecasting, discovery, visualization and download of data related to hydrometeorological variables.'
    FEATURE_3_HEADING:
      value: 'Terms of Use'
    FEATURE_3_BODY:
      value: 'The use of the portal will be carried out under the sole and exclusive responsibility of the user.'
    FIMBENCH_S3_ALLOWED_HOST:
      value: 'sdmlab.s3.amazonaws.com'
    FIMBENCH_S3_BUCKET_URL:
      value: 'https://sdmlab.s3.amazonaws.com/FIM_Database'
    FIMBENCH_S3_CATALOG_KEY:
      value: 'FIM_Viz/catalog_core.json'
    FIMBENCH_S3_VIZ_TILES:
      value: 'https://sdmlab.s3.amazonaws.com/FIM_Database/FIM_Viz/tiles/{z}/{x}/{y}.pbf'

gs-cloud:
  enabled: false

redis:
  enabled: true
  persistence:
    storageClass: 'efs-pv'

postgis:
  image:
    pullPolicy: 'IfNotPresent'
  storageClass:
    storageClassName: 'efs-pv'
  PersistentVolumeClaim:
    name: django-postgis-pv-claim

nodeSelector: {}
tolerations: []
affinity: {}

storageClass:
  provisioner: 'efs.csi.aws.com'
  enabled: true
  storageClassName: 'efs-pv'
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true
  parameters:
    provisioningMode: efs-ap
    directoryPerms: '777'
    gid: '0'
    uid: '0'
