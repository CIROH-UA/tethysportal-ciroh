namespace:
  enabled: false
  name: cirohportal
  limits:
    cpu: '8'
    memory: 16Gi
    ephemeral_storage: '10Gi'
  requests:
    memory: 16Gi
    ephemeral_storage: '20Gi'

image:
  repository: 'awiciroh/tethysapp-ciroh-portal'
  tag: dev_latest
  pullPolicy: 'Always'

secrets:
  existingSecretName: ciroh-portal-secrets

s3Static:
  bucket: ciroh-portal-assets
  region: us-east-1
  cloudfrontDomain: ciroh-portal-assets.s3.us-east-1.amazonaws.com
  endpointUrl: ''

serviceAccount:
  name: ciroh-portal
  roleArn: arn:aws:iam::456531024327:role/ciroh-portal-irsa

# §4.1: provisioning is a single pre-upgrade hook Job running provision.sh (migrate +
# services + static + bootstrap + init.d hooks incl. store link + syncstores). No separate
# provisionJob / no --set flags needed on `helm upgrade`.

externalDatabase:
  host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
  port: 5432
  adminUser: tethys_super

ingresses:
  enabled: true
  external:
    enabled: true
    className: 'alb'
    annotations:
      # Share the ciroh-apps ALB (same group as the *.tethys.ciroh.org apps) so the
      # apex tethys.ciroh.org, whose external DNS points at that shared ALB, gets a
      # listener rule for the portal. Without this the portal gets its own ALB that
      # DNS does not point at, and the apex 404s.
      alb.ingress.kubernetes.io/group.name: ciroh-apps
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=4000
    staticRedirect:
      enabled: true
    hosts:
      - host: tethys.ciroh.org
        paths:
          - path: '/'
            pathType: Prefix
            backend:
              service:
                name: cirohportal-prod
                port:
                  name: http
    tls: []

tethys:
  env:
    PUBLIC_PORTAL_PROTOCOL:
      value: 'https'
    TETHYS_DB_NAME:
      value: tethys_platform
    TETHYS_DB_PORT:
      value: '5432'
    TETHYS_DB_USERNAME:
      value: tethys_default
    FIMSERV_ROOT:
      value: /home/tethys/persist/fimserve
    FIMSERVE_CACHE_MAX_GB:
      value: '3'
    ASGI_PROCESSES:
      value: '1'
    CLIENT_MAX_BODY_SIZE:
      value: 1024M

# Prod: DEBUG off -> serve.sh runs uvicorn (static served from S3, not the dev server).
# values.yaml defaults DEBUG to true for local/k3d; this deep-merge override flips it for prod.
portalConfig:
  settings:
    DEBUG: false

valkey:
  enabled: true

postgis:
  enabled: false

# Lean hub after the cutover: serves the launcher/home/login and acts as the
# OIDC provider only (apps are standalone), so it idles at ~130Mi / ~10m CPU.
# Requests are sized for that, not the old in-process flood-map pipeline; the
# generous memory limit stays as burst headroom.
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 12Gi

nodeSelector: {}
tolerations: []
affinity: {}

ephemeralStorage:
  className: gp3
  size: 10Gi

strategy: RollingUpdate

hpa:
  enabled: true
  # minReplicas 2 keeps a ready pod through rollouts/consolidation so the ALB
  # always has a healthy target (avoids the mid-deploy 502/503 flap).
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
