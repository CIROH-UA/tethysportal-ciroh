global:
  host: ''

replicaCount: 1
strategy: 'Recreate'
# timestamp
image:
  repository: 'awiciroh/tethysapp-ciroh-portal'
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

postgis:
  enabled: true
  fullnameOverride: 'ciroh-db'
  postgres_user: 'postgres'
  postgres_password: 'please_dont_use_default_passwords'
  extra_config:
    max_connections: '500'
    shared_buffers: '512MB'
    work_mem: '5MB'
    autovacuum: 'on'
  service:
    type: ClusterIP
    port: 5432
  storage_size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2
      memory: 4Gi
  storageClass:
    storageClassName: ''
valkey:
  enabled: true
  fullnameOverride: 'ciroh-valkey'
  auth:
    enabled: false
  service:
    port: 6379
    
tethys:
  init_containers:
    wait_for_db: false
    env: {}
  volumeMounts: []
  volumes: []
  configMaps: {}

  env:
    FIMSERV_ROOT:
      value: /home/tethys/persist/fimserve
    FIMSERVE_CACHE_MAX_GB:
      value: '3'
    # USGS-MRMS app: read data from the CIROH bucket via IRSA (no keys). The MRMS
    # dataset was copied to ciroh-portal-assets under the usgs-mrms/ prefix.
    USGS_MRMS_S3_BUCKET:
      value: ciroh-portal-assets
    USGS_MRMS_S3_PREFIX:
      value: usgs-mrms
    USGS_MRMS_S3_REGION:
      value: us-east-1
    HYDRO_HISTORY_S3_PREFIX:
      value: experiments/hydro_history_3mm_all_stage
    # Reference/GRIB2 cache on the per-pod persist volume (not /tmp), so it reuses
    # the sized volume and is skipped on repeat runs for a state on the same pod.
    USGS_MRMS_WORKDIR:
      value: /home/tethys/persist/usgs_mrms
    # NGIAB Visualizer: model runs live in the portal's default S3 storage
    # (ciroh-portal-assets/media/ngiab_visualizer) via IRSA. This switch also puts
    # DuckDB into S3 mode; with no keys it reads the bucket via the credential chain.
    NGIAB_STORAGE_BACKEND:
      value: s3
    NGIAB_RUNS_PREFIX:
      value: ngiab_visualizer
    SWEML_S3_READER_ROLE_ARN:
      value: arn:aws:iam::858933856877:role/ciroh-portal-s3-reader
    # db-env-variables
    TETHYS_DB_NAME:
      value: tethys_platform
    TETHYS_DB_PORT:
      value: '5432'
    TETHYS_DB_USERNAME:
      value: tethys_default
    TETHYS_DB_PASSWORD:
      value: please_dont_use_default_passwords
    TETHYS_DB_SUPERUSER:
      value: tethys_default
    TETHYS_DB_SUPERUSER_PASS:
      value: please_dont_use_default_passwords
    APP_DB_PORT:
      value: '5432'
    APP_DB_USERNAME:
      value: tethys_super
    APP_DB_PASSWORD:
      value: 'please_dont_use_default_passwords'
    # portal-settings
    PUBLIC_PORTAL_PROTOCOL:
      value: 'https'
    ENABLE_OPEN_PORTAL:
      value: true
    BYPASS_TETHYS_HOME_PAGE:
      value: true
    CHANNEL_LAYERS_BACKEND:
      value: channels_redis.core.RedisChannelLayer
    PORTAL_SUPERUSER_NAME:
      value: admin
    PORTAL_SUPERUSER_EMAIL:
      value: none@none.com
    PORTAL_SUPERUSER_PASSWORD:
      value: pass
    TETHYS_SETTINGS_FLAGS:
      value: '--production, --overwrite'
    TETHYS_PUBLIC_HOST:
      value: 'tethys.ciroh.org'
podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
securityContext: {}

portalConfig:
  settings:
    # Dev/k3d default: DEBUG on -> serve.sh runs the Django dev server, which serves /static/
    # locally (no S3/CDN). prod_aws_values.yaml overrides to false (uvicorn + static from S3).
    DEBUG: true
    MEDIA_URL: /media/
    DATA_UPLOAD_MAX_MEMORY_SIZE: 1073741824
    DATA_UPLOAD_MAX_NUMBER_FIELDS: 1073741824
    FILE_UPLOAD_MAX_MEMORY_SIZE: 1073741824
    INSTALLED_APPS:
      - tethysapp.ngiab
    AUTHENTICATION_BACKENDS:
      - tethys_services.backends.hydroshare.HydroShareOAuth2
    OAUTH_CONFIG:
      OAUTH2_PROVIDER:
        OIDC_ENABLED: true
        PKCE_REQUIRED: true
        SCOPES:
          openid: OpenID Connect scope
      SOCIAL_AUTH_LOGIN_REDIRECT_URL: /apps/
    TETHYS_PORTAL_CONFIG:
      ENABLE_OPEN_PORTAL: true
      BYPASS_TETHYS_HOME_PAGE: true
  siteSettings:
    GENERAL_SETTINGS: {}

s3Static:
  bucket: ''
  region: us-east-1
  cloudfrontDomain: ''
  endpointUrl: ''

serviceAccount:
  name: ''
  roleArn: ''

externalDatabase:
  host: ''
  port: 5432
  adminUser: ''

secrets:
  existingSecretName: ciroh-portal-secrets

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Note: The first host in the ingress field is used as TETHYS_PUBLIC_HOST.
# This is true EVEN IF the ingress is not enabled!

ingresses:
  enabled: true
  external:
    enabled: true
    className: ''
    annotations: {}
    # Redirect /static to the S3 assets host (s3Static.cloudfrontDomain) at the
    # load balancer, for apps whose frontend hardcodes /static/ URLs. ALB only.
    staticRedirect:
      enabled: false
      path: /static
    hosts:
      - host: ''
        paths: []
    tls: []

resources:
  requests:
    cpu: 2
    memory: 4Gi
    ephemeral-storage: 3Gi
  limits:
    memory: 6Gi
    ephemeral-storage: 6Gi
nodeSelector: {}
tolerations: []
affinity: {}

ephemeralStorage:
  className: ''
  size: 10Gi

# §4.1: provisioning is one hook Job that runs provision.sh (migrate + services + static +
# bootstrap + init.d hooks incl. store link + syncstores) — see templates/init-job.yaml. There is
# no longer a separate provisionJob or storeLinks; app-store links live in conf/init.d/50-app-stores.sh.

namespace:
  enabled: false
  name: cirohportal
  limits:
    # cpu: '4'
    # memory: 8Gi
    ephemeral_storage: '5Gi'
  requests:
    # cpu: '4'
    # memory: 8Gi
    ephemeral_storage: '5Gi'

pdb:
  enabled: true
  # Prefer maxUnavailable: with HPA minReplicas 1, minAvailable:1 would block
  # draining the sole web pod and deadlock Karpenter consolidation / spot reclaims.
  maxUnavailable: 1
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80