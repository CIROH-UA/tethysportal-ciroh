global:
  host: ''

replicaCount: 1
strategy: 'Recreate'
# timestamp
image:
  repository: 'awiciroh/tethysapp-ciroh-portal'
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

gs-cloud:
  enabled: false

postgis:
  fullnameOverride: 'ciroh-db'
  postgres_user: 'postgres'
  postgres_password: 'please_dont_use_default_passwords'
  extra_config:
    max_connections: '500'
    shared_buffers: '512MB'
    work_mem: '5MB'
    autovacuum: 'on'
  service:
    type: ClusterIP
    port: 5432
  storage_size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2
      memory: 4Gi
  storageClass:
    storageClassName: ''
redis:
  enabled: true
  fullnameOverride: 'ciroh-redis'
  architecture: standalone
  auth:
    enabled: false
  service:
    port: 6379
    
tethys:
  init_containers:
    wait_for_db: false
    env: {}
  volumeMounts: []
  volumes: []
  configMaps: {}
  workspace_size: ''

  env:
    FIMSERV_ROOT:
      value: /home/tethys/persist/fimserve
    FIMSERVE_CACHE_MAX_GB:
      value: '3'
    # db-env-variables
    TETHYS_DB_NAME:
      value: tethys_platform
    TETHYS_DB_PORT:
      value: '5432'
    TETHYS_DB_USERNAME:
      value: tethys_default
    TETHYS_DB_PASSWORD:
      value: please_dont_use_default_passwords
    TETHYS_DB_SUPERUSER:
      value: tethys_default
    TETHYS_DB_SUPERUSER_PASS:
      value: please_dont_use_default_passwords
    APP_DB_PORT:
      value: '5432'
    APP_DB_USERNAME:
      value: tethys_super
    APP_DB_PASSWORD:
      value: 'please_dont_use_default_passwords'
    # portal-settings
    PUBLIC_PORTAL_PROTOCOL:
      value: 'https'
    ENABLE_OPEN_PORTAL:
      value: true
    BYPASS_TETHYS_HOME_PAGE:
      value: true
    CHANNEL_LAYERS_BACKEND:
      value: channels_redis.core.RedisChannelLayer
    PORTAL_SUPERUSER_NAME:
      value: admin
    PORTAL_SUPERUSER_EMAIL:
      value: none@none.com
    PORTAL_SUPERUSER_PASSWORD:
      value: pass
    TETHYS_SETTINGS_FLAGS:
      value: '--production, --overwrite'
    TETHYS_PUBLIC_HOST:
      value: 'tethys.ciroh.org'
    NGINX_PORT:
      value: '8080'
podAnnotations: {}

podSecurityContext: {}
securityContext: {}

portalConfig:
  settings:
    DEBUG: false
    MEDIA_URL: /media/
    DATA_UPLOAD_MAX_MEMORY_SIZE: 1073741824
    DATA_UPLOAD_MAX_NUMBER_FIELDS: 1073741824
    FILE_UPLOAD_MAX_MEMORY_SIZE: 1073741824
    AUTHENTICATION_BACKENDS:
      - tethys_services.backends.hydroshare.HydroShareOAuth2
    OAUTH_CONFIG:
      OAUTH2_PROVIDER:
        OIDC_ENABLED: true
        PKCE_REQUIRED: true
        SCOPES:
          openid: OpenID Connect scope
      SOCIAL_AUTH_LOGIN_REDIRECT_URL: /apps/
    TETHYS_PORTAL_CONFIG:
      ENABLE_OPEN_PORTAL: true
      BYPASS_TETHYS_HOME_PAGE: true
  siteSettings:
    GENERAL_SETTINGS: {}

s3Static:
  bucket: ''
  region: us-east-1
  cloudfrontDomain: ''
  endpointUrl: ''

serviceAccount:
  name: ''
  roleArn: ''

secrets:
  existingSecretName: ciroh-portal-secrets

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Note: The first host in the ingress field is used as TETHYS_PUBLIC_HOST, TETHYS_GS_HOST_PUB, and TETHYS_TDS_HOST_PUB.
# This is true EVEN IF the ingress is not enabled!

ingresses:
  enabled: true
  external:
    enabled: true
    className: ''
    annotations: {}
    hosts:
      - host: ''
        paths: []
    tls: []
  static:
    enabled: true
    className: ''
    annotations: {}
    hosts:
      - host: ''
        paths: []
    tls: []

resources:
  requests:
    cpu: 2
    memory: 4Gi
    ephemeral-storage: 3Gi
  limits:
    memory: 6Gi
    ephemeral-storage: 6Gi
nodeSelector: {}
tolerations: []
affinity: {}

storageClass:
  provisioner: ''
  enable: false
  storageClassName: 'ciroh-storage'
  annotations: {}
  reclaimPolicy: Delete
  parameters: {}
  volumeBindingMode: ''
  allowVolumeExpansion: ''
  mountOptions: []

namespace:
  enabled: false
  name: cirohportal
  limits:
    # cpu: '4'
    # memory: 8Gi
    ephemeral_storage: '5Gi'
  requests:
    # cpu: '4'
    # memory: 8Gi
    ephemeral_storage: '5Gi'

pdb:
  enabled: false
  minAvailable: 1

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80