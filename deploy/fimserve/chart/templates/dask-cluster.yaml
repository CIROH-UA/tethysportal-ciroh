{{- if .Values.dask.enabled -}}
{{- $ta := index .Values "tethys-app" -}}
{{- $ctx := dict "Values" $ta "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template -}}
apiVersion: kubernetes.dask.org/v1
kind: DaskCluster
metadata:
  name: {{ include "fimserve.daskName" . }}
spec:
  idleTimeout: 0
  scheduler:
    service:
      type: ClusterIP
      selector:
        dask.org/cluster-name: {{ include "fimserve.daskName" . }}
        dask.org/component: scheduler
      ports:
        - name: tcp-comm
          port: 8786
          targetPort: tcp-comm
          protocol: TCP
        - name: http-dashboard
          port: 8787
          targetPort: http-dashboard
          protocol: TCP
    spec:
      serviceAccountName: {{ .Values.dask.serviceAccountName }}
      containers:
        - name: scheduler
          image: {{ include "fimserve.daskImage" . | quote }}
          imagePullPolicy: {{ $ta.image.pullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - exec {{ .Values.dask.binary }} scheduler
          ports:
            - name: tcp-comm
              containerPort: 8786
            - name: http-dashboard
              containerPort: 8787
          readinessProbe:
            tcpSocket:
              port: tcp-comm
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dask.scheduler.resources | nindent 12 }}
  worker:
    replicas: 0
    spec:
      serviceAccountName: {{ .Values.dask.serviceAccountName }}
      {{- with .Values.dask.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "fimserve.daskImage" . | quote }}
          imagePullPolicy: {{ $ta.image.pullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              export PATH="${VIRTUAL_ENV:-/opt/conda/envs/tethys}/bin:$PATH"
              /usr/local/bin/portal-config.sh
              export FIMSERV_ROOT={{ .Values.dask.worker.fimservRoot | quote }}
              mkdir -p "$FIMSERV_ROOT"
              exec {{ .Values.dask.binary }} worker {{ include "fimserve.daskSchedulerAddress" . | quote }} \
                --nworkers 1 --nthreads {{ .Values.dask.worker.nthreads }} \
                --memory-limit {{ .Values.dask.worker.memoryLimit }} \
                --local-directory /scratch \
                --no-dashboard \
                --preload tethysapp.fimserve_viewer.dask_worker
          env:
            {{- include "tethys-app.env" $ctx | nindent 12 }}
            - name: DJANGO_ALLOW_ASYNC_UNSAFE
              value: "true"
          volumeMounts:
            - name: portal-config
              mountPath: /config
              readOnly: true
            - name: scratch
              mountPath: /scratch
          resources:
            {{- toYaml .Values.dask.worker.resources | nindent 12 }}
      volumes:
        - name: portal-config
          configMap:
            name: {{ include "tethys-app.fullname" $ctx }}-portal-config
        - name: scratch
          emptyDir: {}
---
apiVersion: kubernetes.dask.org/v1
kind: DaskAutoscaler
metadata:
  name: {{ include "fimserve.daskName" . }}
spec:
  cluster: {{ include "fimserve.daskName" . }}
  minimum: {{ .Values.dask.autoscaler.minimum }}
  maximum: {{ .Values.dask.autoscaler.maximum }}
{{- end }}
