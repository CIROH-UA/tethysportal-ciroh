tethys-app:
  fullnameOverride: fimserve
  image:
    repository: 456531024327.dkr.ecr.us-east-1.amazonaws.com/docker-hub/awiciroh/tethysapp-fimserve
    tag: "332ba8e66971ee00bd273c0df8ef7e93bd89d4e2"
    pullPolicy: Always
  tethys:
    mode: single
    standaloneApp: fimserve_viewer
    env:
      FIMSERV_ROOT:
        value: /home/tethys/persist/fimserve
      FIMSERVE_CACHE_MAX_GB:
        value: '3'
  externalDatabase:
    host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
    port: 5432
    name: tethys_platform_fimserve
    username: tethys_default
  ephemeralStorage:
    className: gp3
  s3Static:
    enabled: true
    bucket: ciroh-portal-assets
    region: us-east-1
  serviceAccount:
    create: false
    name: ciroh-portal
    roleArn: arn:aws:iam::456531024327:role/ciroh-portal-irsa
  secrets:
    existingSecretName: ciroh-portal-secrets
    secretEnv:
      - name: HYDROSHARE_CLIENT_ID
        key: HYDROSHARE_CLIENT_ID
      - name: HYDROSHARE_SECRET_ID
        key: HYDROSHARE_SECRET_ID
      - name: TETHYS_PORTAL_OIDC_KEY
        key: FIMSERVE_OIDC_CLIENT_ID
      - name: TETHYS_PORTAL_OIDC_SECRET
        key: FIMSERVE_OIDC_CLIENT_SECRET
  portalConfig:
    settings:
      ENABLE_OPEN_SIGNUP: false
      ENABLE_OPEN_PORTAL: true
      AUTHENTICATION_BACKENDS:
        - ciroh_portal_oidc.TethysPortalOpenIdConnect
        - django.contrib.auth.backends.ModelBackend
      MIDDLEWARE:
        # Signing out of the app also ends the portal session (see deploy/oidc).
        - ciroh_portal_oidc.PortalLogoutMiddleware
      OAUTH_CONFIG:
        SOCIAL_AUTH_LOGIN_REDIRECT_URL: /
        SOCIAL_AUTH_TETHYS_PORTAL_SCOPE:
          - openid
          - email
          - profile
      STORAGES:
        staticfiles:
          BACKEND: ciroh_portal_static.LeadingSlashS3Storage
    siteSettings:
      GENERAL_SETTINGS:
        brand_text: CIROH
        brand_image: ciroh_theme/images/CIROHLogo.png
        favicon: https://ciroh-portal-assets.s3.amazonaws.com/static/ciroh_theme/images/favicon.ico
        footer_copyright: "Copyright © 2026 CIROH"
  scaleToZero:
    enabled: true
    hosts: ["fimserve.tethys.ciroh.org"]
    maxReplicas: 2
    scaledownPeriod: 300
  pdb:
    enabled: true

dask:
  enabled: true
  serviceAccountName: ciroh-portal
  # Always on; idles at ~10m CPU / ~70Mi.
  scheduler:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
  worker:
    nodeSelector:
      karpenter.sh/capacity-type: spot
    # The autoscaler keeps one worker up at all times (see chart/values.yaml), and
    # it idles at ~25m CPU / ~190Mi. Reserve a quarter of the old 2 CPU / 8Gi so it
    # doesn't hold a node by itself; a job can still burst to the 12Gi limit
    # (memoryLimit 8GiB), with the risk of eviction if the node is full.
    resources:
      requests: { cpu: 500m, memory: 2Gi, ephemeral-storage: 20Gi }
