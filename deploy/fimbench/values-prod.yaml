image:
  repository: awiciroh/tethysapp-fimbench
  tag: latest
  pullPolicy: Always
tethys:
  mode: single
  standaloneApp: fimbench_gui
  publicProtocol: https
externalDatabase:
  host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
  port: 5432
  name: tethys_platform_fimbench
  username: tethys_default
ephemeralStorage:
  className: gp2
s3Static:
  enabled: true
  bucket: ciroh-portal-assets
  region: us-east-1
serviceAccount:
  create: false
  name: ciroh-portal
secrets:
  existingSecretName: ciroh-portal-secrets
  secretEnv:
    - name: HYDROSHARE_CLIENT_ID
      key: HYDROSHARE_CLIENT_ID
    - name: HYDROSHARE_SECRET_ID
      key: HYDROSHARE_SECRET_ID
    - name: TETHYS_PORTAL_OIDC_KEY
      key: FIMBENCH_OIDC_CLIENT_ID
    - name: TETHYS_PORTAL_OIDC_SECRET
      key: FIMBENCH_OIDC_CLIENT_SECRET
portalConfig:
  settings:
    ENABLE_OPEN_SIGNUP: false
    ENABLE_OPEN_PORTAL: true
    AUTHENTICATION_BACKENDS:
      - ciroh_portal_oidc.TethysPortalOpenIdConnect
      - django.contrib.auth.backends.ModelBackend
    OAUTH_CONFIG:
      SOCIAL_AUTH_LOGIN_REDIRECT_URL: /
    STORAGES:
      staticfiles:
        BACKEND: ciroh_portal_static.LeadingSlashS3Storage
  siteSettings:
    GENERAL_SETTINGS:
      brand_text: CIROH
      brand_image: ciroh_theme/images/CIROHLogo.png
      favicon: https://ciroh-portal-assets.s3.amazonaws.com/static/ciroh_theme/images/favicon.ico
      footer_copyright: "Copyright © 2026 CIROH"
scaleToZero:
  enabled: true
  hosts: ["fimbench.tethys.ciroh.org"]
  maxReplicas: 2
  scaledownPeriod: 300
pdb:
  enabled: true
