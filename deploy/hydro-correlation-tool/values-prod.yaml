image:
  repository: gioelkin/tethysapp-hydro-correlation-tool
  tag: hct-c269702 
  pullPolicy: Always
tethys:
  mode: single
  standaloneApp: hydro_correlation_tool
  publicProtocol: https
externalDatabase:
  host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
  port: 5432
  name: tethys_platform_hydrocorrelation
  username: tethys_default
ephemeralStorage:
  className: gp3
s3Static:
  enabled: true
  bucket: ciroh-portal-assets
  region: us-east-1
serviceAccount:
  create: false
  name: ciroh-portal
secrets:
  existingSecretName: ciroh-portal-secrets
  secretEnv:
    - name: HYDROSHARE_CLIENT_ID
      key: HYDROSHARE_CLIENT_ID
    - name: HYDROSHARE_SECRET_ID
      key: HYDROSHARE_SECRET_ID
    - name: TETHYS_PORTAL_OIDC_KEY
      key: HYDRO_CORRELATION_OIDC_CLIENT_ID
    - name: TETHYS_PORTAL_OIDC_SECRET
      key: HYDRO_CORRELATION_OIDC_CLIENT_SECRET
portalConfig:
  settings:
    ENABLE_OPEN_SIGNUP: false
    # Login required: the app mints a per-user DRF token on load
    # (Token.objects.get_or_create(user=request.user)), which raises TypeError for an
    # AnonymousUser. With open portal the anonymous readiness probe hit that and 500'd,
    # crash-looping the pod (KEDA 504). This app stores per-user data, so it needs auth.
    ENABLE_OPEN_PORTAL: false
    AUTHENTICATION_BACKENDS:
      - ciroh_portal_oidc.TethysPortalOpenIdConnect
      - django.contrib.auth.backends.ModelBackend
    OAUTH_CONFIG:
      SOCIAL_AUTH_LOGIN_REDIRECT_URL: /
      SOCIAL_AUTH_TETHYS_PORTAL_SCOPE:
        - openid
        - email
        - profile
    STORAGES:
      staticfiles:
        BACKEND: ciroh_portal_static.LeadingSlashS3Storage
  siteSettings:
    GENERAL_SETTINGS:
      brand_text: CIROH
      brand_image: ciroh_theme/images/CIROHLogo.png
      favicon: https://ciroh-portal-assets.s3.amazonaws.com/static/ciroh_theme/images/favicon.ico
      footer_copyright: "Copyright © 2026 CIROH"
scaleToZero:
  enabled: true
  hosts: ["hydro-correlation.tethys.ciroh.org"]
  maxReplicas: 2
  scaledownPeriod: 300
pdb:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 2Gi
  limits:
    memory: 2Gi
    ephemeral-storage: 4Gi
