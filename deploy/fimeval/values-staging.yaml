# Staging overlay: same RDS instance as prod, separate tethys_platform_staging
# database (seed it from tethys_platform). No public ingress; reach it via
# `kubectl port-forward -n staging svc/fimeval 8080:8080`.
tethys-app:
  # staging has no S3 static; DEBUG runs the dev server which serves /static/ locally
  portalConfig:
    settings:
      DEBUG: true
  tethys:
    # staging apps share ciroh-portal-assets under staging/<app>/
    env:
      FIMEVAL_S3_KEY_PREFIX:
        value: staging/fimeval/
  externalDatabase:
    host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
    port: 5432
    name: tethys_platform_staging
    username: tethys_default
  ephemeralStorage:
    className: gp2
  serviceAccount:
    roleArn: arn:aws:iam::456531024327:role/ciroh-staging-irsa
  ingress:
    enabled: false
  # scale the web pod to 0 when idle; KEDA interceptor wakes it 0->1 on request
  scaleToZero:
    enabled: true
    hosts: ["fimeval.tethys.ciroh.org"]
    maxReplicas: 2
    scaledownPeriod: 120

dask:
  worker:
    nodeSelector:
      karpenter.sh/capacity-type: spot
    env:
      FIMEVAL_TARGET_CRS: EPSG:5070
      FIMEVAL_S3_KEY_PREFIX: fimeval-staging/
