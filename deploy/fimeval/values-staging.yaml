tethys-app:
  portalConfig:
    settings:
      DEBUG: true
  tethys:
    env:
      FIMEVAL_S3_KEY_PREFIX:
        value: staging/fimeval/
  externalDatabase:
    host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
    port: 5432
    name: tethys_platform_staging
    username: tethys_default
  ephemeralStorage:
    className: gp2
  serviceAccount:
    roleArn: arn:aws:iam::456531024327:role/ciroh-staging-irsa
  ingress:
    enabled: false
  scaleToZero:
    enabled: true
    hosts: ["fimeval-staging.tethys.ciroh.org"]
    maxReplicas: 2
    scaledownPeriod: 120

dask:
  worker:
    nodeSelector:
      karpenter.sh/capacity-type: spot
    env:
      FIMEVAL_TARGET_CRS: EPSG:5070
      FIMEVAL_S3_KEY_PREFIX: fimeval-staging/
