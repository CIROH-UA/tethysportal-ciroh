tethys-app:
  image:
    repository: 456531024327.dkr.ecr.us-east-1.amazonaws.com/docker-hub/awiciroh/tethysapp-fimeval-gui
    tag: "332ba8e66971ee00bd273c0df8ef7e93bd89d4e2"
    pullPolicy: IfNotPresent
  tethys:
    mode: single
    standaloneApp: fimeval_gui
    env:
      # Prod data predates the configurable prefix and lives under fimeval/.
      FIMEVAL_S3_KEY_PREFIX:
        value: fimeval/
    initContainers:
      waitForDb: false
  externalDatabase:
    host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
    port: 5432
    name: tethys_platform_fimeval
    username: tethys_default
  ephemeralStorage:
    className: gp3
  s3Static:
    enabled: true
    bucket: ciroh-portal-assets
    region: us-east-1
  serviceAccount:
    create: false
    name: ciroh-portal
  secrets:
    existingSecretName: ciroh-portal-secrets
    secretEnv:
      - name: HYDROSHARE_CLIENT_ID
        key: HYDROSHARE_CLIENT_ID
      - name: HYDROSHARE_SECRET_ID
        key: HYDROSHARE_SECRET_ID
      - name: TETHYS_PORTAL_OIDC_KEY
        key: FIMEVAL_OIDC_CLIENT_ID
      - name: TETHYS_PORTAL_OIDC_SECRET
        key: FIMEVAL_OIDC_CLIENT_SECRET
  portalConfig:
    settings:
      ENABLE_OPEN_SIGNUP: false
      AUTHENTICATION_BACKENDS:
        - ciroh_portal_oidc.TethysPortalOpenIdConnect
        - django.contrib.auth.backends.ModelBackend
      MIDDLEWARE:
        # Signing out of the app also ends the portal session (see deploy/oidc).
        - ciroh_portal_oidc.PortalLogoutMiddleware
      OAUTH_CONFIG:
        SOCIAL_AUTH_LOGIN_REDIRECT_URL: /
        SOCIAL_AUTH_TETHYS_PORTAL_SCOPE:
          - openid
          - email
          - profile
      STORAGES:
        staticfiles:
          BACKEND: ciroh_portal_static.LeadingSlashS3Storage
    siteSettings:
      GENERAL_SETTINGS:
        brand_text: CIROH
        brand_image: ciroh_theme/images/CIROHLogo.png
        favicon: https://ciroh-portal-assets.s3.amazonaws.com/static/ciroh_theme/images/favicon.ico
        footer_copyright: "Copyright © 2026 CIROH"
  scaleToZero:
    enabled: true
    hosts: ["fimeval.tethys.ciroh.org"]
    maxReplicas: 2
    scaledownPeriod: 300
  pdb:
    enabled: true
  # Idles at ~30m CPU / ~330Mi; the chart default (1 CPU / 2Gi) made every cold
  # start ask Karpenter for a much bigger node than it needs. Limits stay as is.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

dask:
  serviceAccountName: ciroh-portal
  # Always on; idles at ~10m CPU / ~70Mi.
  scheduler:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
  worker:
    nodeSelector:
      karpenter.sh/capacity-type: spot
    env:
      FIMEVAL_TARGET_CRS: EPSG:5070
      FIMEVAL_S3_KEY_PREFIX: fimeval/
