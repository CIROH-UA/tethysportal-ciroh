# Shared ALB for standalone app subdomains (*.tethys.ciroh.org), separate from the
# portal's apex ALB. Lives in the `keda` namespace so it can back the KEDA
# interceptor Service (same-namespace rule); the interceptor wakes the target app
# and routes to it cross-namespace by Host. Group `ciroh-apps` = one ALB that every
# app subdomain joins. The *.tethys.ciroh.org ACM cert is auto-discovered.
# Admin repoints ONLY the *.tethys.ciroh.org wildcard to this ALB; the apex stays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fimeval-staging
  namespace: keda
  annotations:
    alb.ingress.kubernetes.io/group.name: ciroh-apps
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: fimeval.tethys.ciroh.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-add-ons-http-interceptor-proxy
                port:
                  number: 8080
