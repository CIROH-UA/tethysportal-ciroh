image:
  repository: awiciroh/tethysapp-usgs-mrms
  tag: latest
  pullPolicy: Always
tethys:
  mode: single
  standaloneApp: usgs_mrms
  publicProtocol: https
  env:
    USGS_MRMS_S3_BUCKET:
      value: "ciroh-portal-assets"
    USGS_MRMS_S3_PREFIX:
      value: "usgs-mrms"
    USGS_MRMS_S3_REGION:
      value: "us-east-1"
    HYDRO_HISTORY_S3_PREFIX:
      value: "experiments/hydro_history_3mm_all_stage"
    USGS_MRMS_WORKDIR:
      value: "/home/tethys/persist/usgs-mrms"
externalDatabase:
  host: ciroh-portal-db.cfmp1axs2tbt.us-east-1.rds.amazonaws.com
  port: 5432
  name: tethys_platform_usgs_mrms
  username: tethys_default
ephemeralStorage:
  className: gp2
s3Static:
  enabled: true
  bucket: ciroh-portal-assets
  region: us-east-1
serviceAccount:
  create: false
  name: ciroh-portal
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 8Gi
secrets:
  existingSecretName: ciroh-portal-secrets
  secretEnv:
    - name: HYDROSHARE_CLIENT_ID
      key: HYDROSHARE_CLIENT_ID
    - name: HYDROSHARE_SECRET_ID
      key: HYDROSHARE_SECRET_ID
    - name: TETHYS_PORTAL_OIDC_KEY
      key: USGS_MRMS_OIDC_CLIENT_ID
    - name: TETHYS_PORTAL_OIDC_SECRET
      key: USGS_MRMS_OIDC_CLIENT_SECRET
portalConfig:
  settings:
    ENABLE_OPEN_SIGNUP: false
    AUTHENTICATION_BACKENDS:
      - ciroh_portal_oidc.TethysPortalOpenIdConnect
      - django.contrib.auth.backends.ModelBackend
    OAUTH_CONFIG:
      SOCIAL_AUTH_LOGIN_REDIRECT_URL: /
    STORAGES:
      staticfiles:
        BACKEND: ciroh_portal_static.LeadingSlashS3Storage
  siteSettings:
    GENERAL_SETTINGS:
      brand_text: CIROH
      brand_image: ciroh_theme/images/CIROHLogo.png
      favicon: https://ciroh-portal-assets.s3.amazonaws.com/static/ciroh_theme/images/favicon.ico
      footer_copyright: "Copyright © 2026 CIROH"
scaleToZero:
  enabled: true
  hosts: ["usgs-mrms.tethys.ciroh.org"]
  maxReplicas: 2
  scaledownPeriod: 300
pdb:
  enabled: true
