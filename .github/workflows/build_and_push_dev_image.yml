name: build_push_dev_image

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    # What goes into the portal image or its deploy; app submodules don't (each
    # app is its own image, built by build_push_app_images).
    paths:
      - 'conf/**'
      - 'extensions/**'
      - 'Dockerfile'
      - 'requirements/**'
      - 'charts/ciroh/**'
      - 'dev/smoke_portal.py'
      - '.github/workflows/build_and_push_dev_image.yml'
      - '.github/workflows/helm_deploy.yml'
      - '.github/actions/deploy-portal/**'
  pull_request:

env:
  DOCKER_HUB_ORG: awiciroh
  DOCKER_REPO: tethysapp-ciroh-portal

permissions:
  contents: read
  security-events: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'

      - name: Set Tag
        run: |
          echo "TAG=dev_${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "TAG_LATEST=dev_latest" >> "$GITHUB_ENV"

      - name: Test Tag
        run: |
          echo "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Scan image with Anchore (Grype)
        id: scan
        uses: anchore/scan-action@v5
        env:
          GRYPE_CONFIG: .github/security/.grype.yaml
        with:
          image: ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # The portal ships no apps (each is its own image); check what it does ship.
      - name: Smoke test the portal
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=tethys_portal.settings \
            -e TETHYS_SECRET_KEY=ci-smoke \
            -v ${{ github.workspace }}/dev/smoke_portal.py:/tmp/smoke_portal.py:ro \
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }} \
            /opt/conda/envs/tethys/bin/python /tmp/smoke_portal.py

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}


  cleanup:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: only keeps the first 5 image
        run: |
          echo "TAG=dev_${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "$TAG"
          . .github/scripts/clean_up_docker_hub.sh '${{ secrets.DOCKER_BUILDER_USERNAME }}' '${{ secrets.DOCKER_BUILDER_TOKEN }}' '${{ env.DOCKER_HUB_ORG }}' '${{ env.DOCKER_REPO }}' '${{ env.MAX_NUMBER_IMAGE }}'

  deploy-with_dry-run:
    needs: [build]
    # This branch's helm_deploy (relative path), not @main, matching the prod build.
    uses: ./.github/workflows/helm_deploy.yml
    with:
      image-tag: dev_${{ github.sha }}
      dry-run: true
    secrets: inherit
