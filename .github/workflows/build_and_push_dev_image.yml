name: build_push_dev_image

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - 'apps/**'
      - 'salt/**'
      - 'extensions/**'
      - 'config/**'
      - 'Dockerfile'
      - 'requirements/**'
  pull_request:

env:
  DOCKER_HUB_ORG: awiciroh
  DOCKER_REPO: tethysapp-ciroh-portal

permissions:
  contents: read
  security-events: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Free disk space ON THIS runner before building. The old `clean-space`
      # reusable workflow ran as a separate job on a different runner, so it
      # never freed space for this build (the image build then died on
      # "No space left on device"). This step runs in-job so it actually helps.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'

      - name: Update submodules recursively
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: checkout Hydrocompute submodule
        run: |
          cd apps/tethysapp-hydrocompute/tethysapp/hydrocompute/public/HydroCompute && git submodule update --force --init --recursive --remote

      - name: Set Tag
        run: |
          echo "TAG=dev_${GITHUB_SHA}" >> $GITHUB_ENV
          echo "TAG_LATEST=dev_latest" >> $GITHUB_ENV

      - name: Test Tag
        run: |
          echo $TAG

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}
          # Registry-backed layer cache on Docker Hub (persists across runs, no
          # 10 GB GHA-cache eviction). CI's builder creds can push to awiciroh;
          # the 'buildcache' tag is ignored by the dev_* cleanup script.
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Scan image with Anchore (Grype)
        id: scan
        uses: anchore/scan-action@v5
        env:
          GRYPE_CONFIG: .github/security/.grype.yaml
        with:
          image: ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}


  cleanup:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: only keeps the first 5 image
        run: |
          echo "TAG=dev_${GITHUB_SHA}" >> $GITHUB_ENV
          echo $TAG
          . .github/scripts/clean_up_docker_hub.sh '${{ secrets.DOCKER_BUILDER_USERNAME }}' '${{ secrets.DOCKER_BUILDER_TOKEN }}' '${{ env.DOCKER_HUB_ORG }}' '${{ env.DOCKER_REPO }}' '${{ env.MAX_NUMBER_IMAGE }}'

  deploy-with_dry-run:
    needs: [build]
    permissions:
      id-token: write
      contents: read
    # Use this branch's helm_deploy (relative path), not @main. main's older
    # helm_deploy requires GPG_PRIVATE_KEY/PASSPHRASE/FILE_SYSTEM_ID secrets that
    # no longer exist, which made `secrets: inherit` fail at evaluation. The
    # current workflow only needs the AWS creds. Matches the prod build workflow.
    uses: ./.github/workflows/helm_deploy.yml
    with:
      dry-run: true
    secrets: inherit
