name: build_push_app_images
# Build every standalone app image on the CIROH Tethys base, test it when its
# Dockerfile has a `test` stage, and push it to Docker Hub as awiciroh/<repo>.
# Only apps that changed are built: their deploy/ folder (minus overlays, ingress,
# chart and docs) or submodule changed, or their APPS entry here did (including the
# base they resolve to, so bumping DEFAULT_BUILDER rebuilds the apps on it). Other edits to this file rebuild
# nothing; dispatch with apps=all to rebuild everything. A push is compared with
# the previous push, and a pull request with its previous push too (the first one
# with where it branched from main), so every commit only builds what it touched.
# An app's <sha> tag therefore exists only for commits that built it.
# Pull requests publish only the immutable <sha> tag; push and manual dispatch
# also move :latest. Another workflow can call this one with apps and ref (a full
# commit sha) to build that commit's images; it publishes only the <sha> tag
# (app_requests.yml does this for its update PRs).
#
# Every app comes from a submodule. An app that can't be one can set source_repo
# instead (see APPS): that repo is checked out and passed as the `app` named
# build context, and the image is tagged <portal sha>-<app sha>. Changes in such
# a repo don't trigger this workflow; dispatch it (optionally with source_ref).
#
# To add an app, add one entry to APPS below.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app keys to build (e.g. hydro-correlation-tool,nrds), or "all"'
        required: false
        default: 'all'
      ciroh_tethys_builder:
        description: 'CIROH Tethys builder base image to build on (blank = each app''s default)'
        required: false
        default: ''
      source_ref:
        description: 'Branch, tag or sha of the app repo for source_repo apps (blank = each app''s default)'
        required: false
        default: ''
  workflow_call:
    inputs:
      apps:
        description: Comma-separated app keys to build
        type: string
        required: true
      ref:
        description: Full commit sha to build; images are tagged with it
        type: string
        required: true
    secrets:
      DOCKER_BUILDER_USERNAME:
        required: true
      DOCKER_BUILDER_TOKEN:
        required: true
  push:
    branches:
      - '*'
    paths:
      - 'deploy/**'
      - 'apps/**'
      - '.github/workflows/build_and_push_app_images.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'apps/**'
      - '.github/workflows/build_and_push_app_images.yml'

env:
  DOCKER_HUB_ORG: awiciroh
  DEFAULT_BUILDER: awiciroh/ciroh-tethys:builder_639eda75d3773cbd01655294c4b09d39ce734dff
  # Keep DEFAULT_BUILDER and `ARG UVX_BUILDER` in deploy/*/Dockerfile on the same base.
  # key = deploy/<key>/Dockerfile. builder is optional (defaults to DEFAULT_BUILDER;
  # set it only for an app that can't move to the default yet, and say why);
  # submodule_flags is optional. An app that can't be a submodule sets submodules
  # to "" plus source_repo/source_ref (checked out as the `app` build context) and
  # context (the docker build context, default "."); none does today.
  APPS: |
    [
      {"key": "cses",                   "repo": "tethysapp-cses",                   "submodules": "apps/Tethys-CSES"},
      {"key": "fimbench",               "repo": "tethysapp-fimbench",               "submodules": "apps/fimbench"},
      {"key": "fimeval",                "repo": "tethysapp-fimeval-gui",            "submodules": "apps/tethysapp-fimeval-gui"},
      {"key": "fimserve",               "repo": "tethysapp-fimserve",               "submodules": "apps/fimserv-viewer"},
      {"key": "hydro-correlation-tool", "repo": "tethysapp-hydro-correlation-tool", "submodules": "apps/hydro-correlation-tool"},
      {"key": "hydrocompute",           "repo": "tethysapp-hydrocompute",           "submodules": "apps/tethysapp-hydrocompute",
       "submodule_flags": "--recursive"},
      {"key": "ngiab",                  "repo": "tethysapp-ngiab",                  "submodules": "apps/ngiab-client"},
      {"key": "nrds",                   "repo": "tethysapp-nrds",                   "submodules": "apps/nrds-client"},
      {"key": "snow-inspector",         "repo": "tethysapp-snow-inspector",         "submodules": "apps/snow-inspector"},
      {"key": "sweml",                  "repo": "tethysapp-sweml",                  "submodules": "apps/tethysapp-sweml"},
      {"key": "tethysdash",             "repo": "tethysapp-tethysdash",             "submodules": "apps/tethysapp-tethys_dash"},
      {"key": "usgs-mrms",              "repo": "tethysapp-usgs-mrms",              "submodules": "apps/usgs_mrms_tethys_app apps/mrms_usgs_events"}
    ]

permissions:
  contents: read

concurrency:
  group: app-images-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # The workflow's own commit, never inputs.ref: a call names its apps, so
      # nothing here reads the checkout (the builds below check out inputs.ref).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'false'

      - name: Pick the apps to build
        id: pick
        env:
          # A call from another workflow names its apps, like a dispatch.
          EVENT: ${{ inputs.ref != '' && 'workflow_dispatch' || github.event_name }}
          WANTED: ${{ inputs.apps }}
          BUILDER_OVERRIDE: ${{ github.event.inputs.ciroh_tethys_builder }}
          SOURCE_REF_OVERRIDE: ${{ github.event.inputs.source_ref }}
          PR_ACTION: ${{ github.event.action }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          WORKFLOW: .github/workflows/build_and_push_app_images.yml
        run: |
          is_commit() { [ -n "$1" ] && [ "$1" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }

          # The commit to compare against: the previous push, or for a new or
          # rebased pull request the point where it branched from main.
          OLD=""
          if [ "$EVENT" = "pull_request" ]; then
            NEW="$PR_HEAD"
            if [ "$PR_ACTION" = "synchronize" ] && is_commit "$BEFORE" && git merge-base --is-ancestor "$BEFORE" "$NEW"; then
              OLD="$BEFORE"
            else
              OLD=$(git merge-base "$PR_BASE" "$NEW")
            fi
          elif [ "$EVENT" = "push" ]; then
            NEW="$GITHUB_SHA"
            if is_commit "$BEFORE"; then OLD="$BEFORE"; fi
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$WANTED" ] || [ "$WANTED" = "all" ]; then
              keys=$(jq -c '[.[].key]' <<<"$APPS")
            else
              keys=$(jq -cR 'split(",") | map(gsub("^ +| +$"; ""))' <<<"$WANTED")
            fi
          elif [ -z "$OLD" ]; then
            # new branch: no previous commit to compare against, build everything
            keys=$(jq -c '[.[].key]' <<<"$APPS")
          else
            echo "Comparing $OLD..$NEW"
            # Deploy-only files in deploy/<app>/ (overlays, ingress, chart, docs)
            # don't go into the image, so they don't trigger a build.
            changed=$(git diff --name-only "$OLD" "$NEW" | jq -Rsc '
              split("\n") | map(select(. != "")
                | select(test("^deploy/[^/]+/(values[^/]*\\.yaml|ingress\\.yaml|[^/]*\\.md|chart/.*)$") | not))')
            echo "Changed files that can affect images: $changed"
            # Each app's APPS entry with its builder resolved, before and after.
            resolve='map(.builder //= $default) | map({key: .key, value: .}) | from_entries'
            new_cfg=$(jq -c --arg default "$DEFAULT_BUILDER" "$resolve" <<<"$APPS")
            if git cat-file -e "$OLD:$WORKFLOW" 2>/dev/null; then
              old_wf=$(git show "$OLD:$WORKFLOW")
              old_cfg=$(jq -c --arg default "$(yq -r '.env.DEFAULT_BUILDER' <<<"$old_wf")" "$resolve" \
                          <<<"$(yq -r '.env.APPS' <<<"$old_wf")")
            else
              old_cfg='{}'
            fi
            keys=$(jq -c --argjson changed "$changed" --argjson old "$old_cfg" --argjson new "$new_cfg" '
              [ .[]
                | . as $app
                | (["deploy/\($app.key)/"] + ($app.submodules | split(" ") | map(select(. != "")))) as $paths
                | select(
                    any($changed[]; . as $f | any($paths[]; . as $p | $f == $p or ($f | startswith($p))))
                    or $old[$app.key] != $new[$app.key])
                | .key ]' <<<"$APPS")
          fi
          echo "Apps to build: $keys"
          matrix=$(jq -c --argjson keys "$keys" --arg default "$DEFAULT_BUILDER" --arg override "$BUILDER_OVERRIDE" \
                         --arg ref_override "$SOURCE_REF_OVERRIDE" '
            { include: [ .[] | select(.key as $k | $keys | index($k))
                         | .builder = (if $override != "" then $override else (.builder // $default) end)
                         | .submodule_flags = (.submodule_flags // "")
                         | .source_repo = (.source_repo // "")
                         | .source_ref = (if .source_repo != "" and $ref_override != "" then $ref_override else (.source_ref // "") end)
                         | .context = (.context // ".") ] }' <<<"$APPS")
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.include | length > 0' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: ${{ matrix.key }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      IMAGE: awiciroh/${{ matrix.repo }}
      DOCKERFILE: deploy/${{ matrix.key }}/Dockerfile
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          submodules: 'false'

      - name: Check out the app submodule(s)
        if: matrix.submodules != ''
        run: git submodule update --init ${{ matrix.submodule_flags }} --depth 1 ${{ matrix.submodules }}

      - name: Check out the app repo
        if: matrix.source_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repo }}
          ref: ${{ matrix.source_ref }}
          path: _app_src
          fetch-depth: 1

      - name: Set image tags
        env:
          CALL_REF: ${{ inputs.ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          elif [ -n "$CALL_REF" ]; then
            SHA="$CALL_REF"
          else
            SHA="${GITHUB_SHA}"
          fi
          if [ -n "${{ matrix.source_repo }}" ]; then
            SHA="${SHA}-$(git -C _app_src rev-parse --short=7 HEAD)"
            echo "BUILD_CONTEXTS=app=${GITHUB_WORKSPACE}/_app_src" >> "$GITHUB_ENV"
          fi
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${IMAGE}:${SHA}"
            if [ "${{ github.event_name }}" != "pull_request" ] && [ -z "$CALL_REF" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Does the Dockerfile have a test stage?
        id: has_test
        run: |
          if grep -qiE '^FROM .+ AS test$' "$DOCKERFILE"; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$DOCKERFILE has no test stage; skipping tests"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build test image
        if: steps.has_test.outputs.test == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ env.DOCKERFILE }}
          build-contexts: ${{ env.BUILD_CONTEXTS }}
          platforms: linux/amd64
          target: test
          load: true
          tags: app:test
          build-args: |
            UVX_BUILDER=${{ matrix.builder }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Run tests
        if: steps.has_test.outputs.test == 'true'
        run: docker run --rm app:test

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ env.DOCKERFILE }}
          build-contexts: ${{ env.BUILD_CONTEXTS }}
          platforms: linux/amd64
          push: true
          build-args: |
            UVX_BUILDER=${{ matrix.builder }}
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
