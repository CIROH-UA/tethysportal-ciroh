name: build_push_app_images
# Build every standalone app image on the CIROH Tethys base, test it when its
# Dockerfile has a `test` stage, and push it to Docker Hub as awiciroh/<repo>.
# Only apps whose deploy/ folder or submodule changed are built (all of them when
# this workflow changes). Pull requests publish only the immutable <sha> tag;
# push and manual dispatch also move :latest.
#
# Apps whose source lives in its own repo instead of a submodule (FIMeval,
# FIMserve) check that repo out and pass it as the `app` named build context.
# Their images are tagged <portal sha>-<app sha> since both trees go into them.
# Changes in those app repos don't trigger this workflow; dispatch it with
# apps=fimeval (and optionally source_ref) after merging there.
#
# To add an app, add one entry to APPS below.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app keys to build (e.g. hydro-correlation-tool,nrds), or "all"'
        required: false
        default: 'all'
      ciroh_tethys_builder:
        description: 'CIROH Tethys builder base image to build on (blank = each app''s default)'
        required: false
        default: ''
      source_ref:
        description: 'Branch, tag or sha of the app repo for source_repo apps (blank = each app''s default)'
        required: false
        default: ''
  push:
    branches:
      - '*'
    paths:
      - 'deploy/**'
      - 'apps/**'
      - '.github/workflows/build_and_push_app_images.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'apps/**'
      - '.github/workflows/build_and_push_app_images.yml'

env:
  DOCKER_HUB_ORG: awiciroh
  DEFAULT_BUILDER: awiciroh/ciroh-tethys:builder_9aa1fb30f333da7bead57939b0ac0651b0ea3090
  # key = deploy/<key>/Dockerfile. builder is optional (defaults to DEFAULT_BUILDER);
  # submodule_flags is optional. An app built from its own repo sets submodules to
  # "" plus source_repo/source_ref (checked out as the `app` build context) and
  # context (the docker build context, default ".").
  APPS: |
    [
      {"key": "cses",                   "repo": "tethysapp-cses",                   "submodules": "apps/Tethys-CSES",
       "builder": "awiciroh/ciroh-tethys:builder_2f82ca658945cb6f69818b3d98ed820b646cef99"},
      {"key": "fimbench",               "repo": "tethysapp-fimbench",               "submodules": "apps/fimbench",
       "builder": "awiciroh/ciroh-tethys:builder_7b6f2eb3f4ce67d81e1f10fc2ff7fce6fae14257"},
      {"key": "fimeval",                "repo": "tethysapp-fimeval-gui",            "submodules": "",
       "source_repo": "Aquaveo/tethysapp-fimeval-gui", "source_ref": "main", "context": "deploy/fimeval"},
      {"key": "fimserve",               "repo": "tethysapp-fimserve",               "submodules": "",
       "source_repo": "Aquaveo/fimserv-viewer", "source_ref": "feat/dask-offload", "context": "deploy/fimserve"},
      {"key": "hydro-correlation-tool", "repo": "tethysapp-hydro-correlation-tool", "submodules": "apps/hydro-correlation-tool"},
      {"key": "hydrocompute",           "repo": "tethysapp-hydrocompute",           "submodules": "apps/tethysapp-hydrocompute",
       "submodule_flags": "--recursive"},
      {"key": "ngiab",                  "repo": "tethysapp-ngiab",                  "submodules": "apps/ngiab-client"},
      {"key": "nrds",                   "repo": "tethysapp-nrds",                   "submodules": "apps/nrds-client"},
      {"key": "snow-inspector",         "repo": "tethysapp-snow-inspector",         "submodules": "apps/snow-inspector"},
      {"key": "sweml",                  "repo": "tethysapp-sweml",                  "submodules": "apps/tethysapp-sweml"},
      {"key": "tethysdash",             "repo": "tethysapp-tethysdash",             "submodules": "apps/tethysapp-tethys_dash"},
      {"key": "usgs-mrms",              "repo": "tethysapp-usgs-mrms",              "submodules": "apps/usgs_mrms_tethys_app apps/mrms_usgs_events"}
    ]

permissions:
  contents: read

concurrency:
  group: app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'false'

      - name: Pick the apps to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ github.event.inputs.apps }}
          BUILDER_OVERRIDE: ${{ github.event.inputs.ciroh_tethys_builder }}
          SOURCE_REF_OVERRIDE: ${{ github.event.inputs.source_ref }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$WANTED" ] || [ "$WANTED" = "all" ]; then
              keys=$(jq -c '[.[].key]' <<<"$APPS")
            else
              keys=$(jq -cR 'split(",") | map(gsub("^ +| +$"; ""))' <<<"$WANTED")
            fi
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # new branch: no previous commit to compare against, build everything
            keys=$(jq -c '[.[].key]' <<<"$APPS")
          else
            changed=$(git diff --name-only "$BASE" "$GITHUB_SHA" | jq -Rsc 'split("\n") | map(select(. != ""))')
            echo "Changed files: $changed"
            keys=$(jq -c --argjson changed "$changed" '
              if ($changed | index(".github/workflows/build_and_push_app_images.yml")) then [.[].key]
              else [ .[]
                     | . as $app
                     | (["deploy/\($app.key)/"] + ($app.submodules | split(" ") | map(select(. != "")))) as $paths
                     | select(any($changed[]; . as $f | any($paths[]; . as $p | $f == $p or ($f | startswith($p)))))
                     | .key ]
              end' <<<"$APPS")
          fi
          matrix=$(jq -c --argjson keys "$keys" --arg default "$DEFAULT_BUILDER" --arg override "$BUILDER_OVERRIDE" \
                         --arg ref_override "$SOURCE_REF_OVERRIDE" '
            { include: [ .[] | select(.key as $k | $keys | index($k))
                         | .builder = (if $override != "" then $override else (.builder // $default) end)
                         | .submodule_flags = (.submodule_flags // "")
                         | .source_repo = (.source_repo // "")
                         | .source_ref = (if .source_repo != "" and $ref_override != "" then $ref_override else (.source_ref // "") end)
                         | .context = (.context // ".") ] }' <<<"$APPS")
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.include | length > 0' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: ${{ matrix.key }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      IMAGE: awiciroh/${{ matrix.repo }}
      DOCKERFILE: deploy/${{ matrix.key }}/Dockerfile
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'

      - name: Check out the app submodule(s)
        if: matrix.submodules != ''
        run: git submodule update --init ${{ matrix.submodule_flags }} --depth 1 ${{ matrix.submodules }}

      - name: Check out the app repo
        if: matrix.source_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repo }}
          ref: ${{ matrix.source_ref }}
          path: _app_src
          fetch-depth: 1

      - name: Set image tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${GITHUB_SHA}"
          fi
          if [ -n "${{ matrix.source_repo }}" ]; then
            SHA="${SHA}-$(git -C _app_src rev-parse --short=7 HEAD)"
            echo "BUILD_CONTEXTS=app=${GITHUB_WORKSPACE}/_app_src" >> "$GITHUB_ENV"
          fi
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${IMAGE}:${SHA}"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Does the Dockerfile have a test stage?
        id: has_test
        run: |
          if grep -qiE '^FROM .+ AS test$' "$DOCKERFILE"; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$DOCKERFILE has no test stage; skipping tests"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build test image
        if: steps.has_test.outputs.test == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ env.DOCKERFILE }}
          build-contexts: ${{ env.BUILD_CONTEXTS }}
          platforms: linux/amd64
          target: test
          load: true
          tags: app:test
          build-args: |
            UVX_BUILDER=${{ matrix.builder }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Run tests
        if: steps.has_test.outputs.test == 'true'
        run: docker run --rm app:test

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ env.DOCKERFILE }}
          build-contexts: ${{ env.BUILD_CONTEXTS }}
          platforms: linux/amd64
          push: true
          build-args: |
            UVX_BUILDER=${{ matrix.builder }}
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
