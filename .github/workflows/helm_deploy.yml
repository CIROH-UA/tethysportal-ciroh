on:
  workflow_dispatch:
    inputs:
      dry-run:
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      dry-run:
        required: true
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy-to-eks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: ciroh-portal-prod
      NAMESPACE: cirohportal
      PORTAL_SECRET_NAME: ciroh-portal-secrets
      RELEASE_NAME: cirohportal-prod

    steps:
      - uses: actions/checkout@v4

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Setup Kubernetes context
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify the portal secret exists
        run: |
          if ! kubectl get secret "${PORTAL_SECRET_NAME}" -n "${NAMESPACE}" > /dev/null 2>&1; then
            echo "::error::Secret ${PORTAL_SECRET_NAME} not found in namespace ${NAMESPACE}."
            echo "Create it once with the portal credentials before deploying:"
            echo "  kubectl create secret generic ${PORTAL_SECRET_NAME} -n ${NAMESPACE} \\"
            echo "    --from-literal=TETHYS_SECRET_KEY=... \\"
            echo "    --from-literal=TETHYS_DB_PASSWORD=... \\"
            echo "    --from-literal=TETHYS_PS_CONNECTION=user:pass@host:port \\"
            echo "    --from-literal=HYDROSHARE_CLIENT_ID=... \\"
            echo "    --from-literal=HYDROSHARE_SECRET_ID=... \\"
            echo "    --from-file=OIDC_RSA_PRIVATE_KEY=key.pem \\"
            echo "    --from-literal=CSES_ACCESS_KEY_ID=..."
            exit 1
          fi

      - name: Set Tag
        run: echo "TAG=dev_${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Install helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Build chart dependencies
        run: helm dependency build charts/ciroh

      - name: Provision database (migrate + link + syncstores)
        if: ${{ !inputs.dry-run }}
        run: |
          helm template ${{ env.RELEASE_NAME }} charts/ciroh \
            -f charts/ciroh/ci/prod_aws_values.yaml \
            --set secrets.existingSecretName=${{ env.PORTAL_SECRET_NAME }} \
            --set image.tag=${{ env.TAG }} \
            --set provisionJob.enabled=true \
            --set provisionJob.asHook=false \
            --namespace ${{ env.NAMESPACE }} \
            --show-only templates/provision-job.yaml > /tmp/provision.yaml
          kubectl delete job ${{ env.RELEASE_NAME }}-provision -n ${{ env.NAMESPACE }} --ignore-not-found
          kubectl apply -f /tmp/provision.yaml -n ${{ env.NAMESPACE }}
          kubectl wait --for=condition=complete job/${{ env.RELEASE_NAME }}-provision -n ${{ env.NAMESPACE }} --timeout=900s \
            || { kubectl logs job/${{ env.RELEASE_NAME }}-provision -n ${{ env.NAMESPACE }} --all-containers --tail=100; exit 1; }
          kubectl logs job/${{ env.RELEASE_NAME }}-provision -n ${{ env.NAMESPACE }} -c provision --tail=30

      - name: Deploy Helm chart to EKS
        run: |
          helm upgrade ${{ env.RELEASE_NAME }} charts/ciroh --install \
            ${{ inputs.dry-run && '--dry-run' || '' }} \
            --timeout=3600s \
            -f charts/ciroh/ci/prod_aws_values.yaml \
            --set secrets.existingSecretName=${{ env.PORTAL_SECRET_NAME }} \
            --set image.tag=${{ env.TAG }} \
            --namespace ${{ env.NAMESPACE }}
