name: helm_deploy
# Deploy the portal release (charts/ciroh) to ciroh-portal-prod. Called by
# build_push_deploy_prod_image on a release tag (real deploy, behind the
# `production` environment's approval) and by build_push_dev_image (dry run).
# The standalone apps are deployed by deploy_apps.yml.

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Portal image tag to deploy (e.g. v1.2.0)'
        required: true
        type: string
      dry-run:
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string
      dry-run:
        required: true
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

# Reads only: the deploy uses the AWS secrets, not the GITHUB_TOKEN.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: ciroh-portal-prod
  NAMESPACE: cirohportal
  PORTAL_SECRET_NAME: ciroh-portal-secrets
  RELEASE_NAME: cirohportal-prod
  IMAGE_REPO: awiciroh/tethysapp-ciroh-portal

jobs:
  dry-run:
    if: inputs.dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-portal
        with:
          image-tag: ${{ inputs.image-tag }}
          dry-run: 'true'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-to-eks:
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-portal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # GitHub creates a missing environment on first use with no protection, which
      # would deploy without approval. Refuse until an admin has set reviewers.
      - name: Check the production environment requires approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            -q '[.protection_rules[].type] | join(",")' 2>/dev/null || true)
          if [[ ",$rules," != *",required_reviewers,"* ]]; then
            echo "::error::The production environment is missing or has no required reviewers. A repo admin must add them (Settings > Environments > production) before the portal deploys."
            exit 1
          fi

      - uses: ./.github/actions/deploy-portal
        with:
          image-tag: ${{ inputs.image-tag }}
          dry-run: 'false'
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
