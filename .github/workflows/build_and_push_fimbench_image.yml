name: build_push_fimbench_image
# Build the standalone FIMbench app image on the CIROH Tethys base and push it to
# Docker Hub as awiciroh/tethysapp-fimbench. Pull requests publish only the
# immutable <sha> tag; push and manual dispatch also move the floating :latest.

on:
  workflow_dispatch:
    inputs:
      ciroh_tethys_builder:
        description: 'CIROH Tethys builder base image to build on'
        required: false
        default: 'awiciroh/ciroh-tethys:builder_7b6f2eb3f4ce67d81e1f10fc2ff7fce6fae14257'
  push:
    branches:
      - '*'
    paths:
      - 'deploy/fimbench/**'
      - 'apps/fimbench'
      - '.github/workflows/build_and_push_fimbench_image.yml'
  pull_request:
    paths:
      - 'deploy/fimbench/**'
      - 'apps/fimbench'
      - '.github/workflows/build_and_push_fimbench_image.yml'

env:
  DOCKER_HUB_ORG: awiciroh
  DOCKER_REPO: tethysapp-fimbench
  CIROH_TETHYS_BUILDER: ${{ github.event.inputs.ciroh_tethys_builder || 'awiciroh/ciroh-tethys:builder_7b6f2eb3f4ce67d81e1f10fc2ff7fce6fae14257' }}

permissions:
  contents: read

concurrency:
  group: fimbench-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'

      - name: Check out the FIMbench app submodule
        run: git submodule update --init --depth 1 apps/fimbench

      - name: Set image tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          else
            SHA="${GITHUB_SHA}"
          fi
          IMAGE="${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}"
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${IMAGE}:${SHA}"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Show tags
        run: printf '%s\n' "${IMAGE_TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/fimbench/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            UVX_BUILDER=${{ env.CIROH_TETHYS_BUILDER }}
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
