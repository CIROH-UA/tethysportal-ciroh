name: build_push_deploy_prod_image
# Push to docker hub if tag has been created.
on:
  push:
    tags:
      - '*'
env:
  DOCKER_HUB_ORG: awiciroh
  DOCKER_REPO: tethysapp-ciroh-portal

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Free disk space ON THIS runner before building (see build_and_push_dev_image.yml).
      # The old clean-space job ran on a different runner, so it never helped here.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'

      - name: Update submodules recursively
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: checkout Hydrocompute submodule
        run: |
          cd apps/tethysapp-hydrocompute/tethysapp/hydrocompute/public/HydroCompute && git submodule update --force --init --recursive --remote

      - name: Set Tag
        run: |
          echo "TAG=dev_${GITHUB_SHA}" >> $GITHUB_ENV
          echo "TAG_LATEST=latest" >> $GITHUB_ENV

      - name: Test Tag
        run: |
          echo $TAG

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}
          # Registry-backed layer cache on Docker Hub (persists across runs, no
          # 10 GB GHA-cache eviction). Shared with the dev build so both reuse
          # the same 'buildcache' tag; ignored by the dev_* cleanup script.
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Scan image with Anchore (Grype)
        id: scan
        uses: anchore/scan-action@v5
        continue-on-error: true
        env:
          GRYPE_CONFIG: .github/security/.grype.yaml
        with:
          image: ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          fail-build: true
          output-format: table
          severity-cutoff: high
          only-fixed: true

      - name: Smoke test all apps import cleanly
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=tethys_portal.settings \
            -e TETHYS_SECRET_KEY=ci-smoke \
            -v ${{ github.workspace }}/dev/smoke_all_apps.py:/tmp/smoke_all_apps.py:ro \
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }} \
            /opt/conda/envs/tethys/bin/python /tmp/smoke_all_apps.py

      - name: Push image
        if: steps.scan.outcome == 'success'
        run: |
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}

  # update chart deployment
  deploy_chart:
    needs: [build]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm_deploy.yml
    with:
      dry-run: false
    secrets: inherit
