name: build_push_deploy_prod_image
# Push to docker hub if tag has been created.
on:
  push:
    tags:
      - '*'
env:
  DOCKER_HUB_ORG: awiciroh
  DOCKER_REPO: tethysapp-ciroh-portal

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  #clean space, so docker image build does not get killed
  clean-space:
    uses: CIROH-UA/tethysportal-ciroh/.github/workflows/clean_space.yml@main

  # build image
  build:
    needs: [clean-space]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'false'

      - name: Update submodules recursively
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # Checks-out the hydrocompute extra submodule
      - name: checkout Hydrocompute submodule
        run: |
          cd apps/tethysapp-hydrocompute/tethysapp/hydrocompute/public/HydroCompute && git submodule update --force --init --recursive --remote

      - name: Set Tag
        run: |
          echo "TAG=dev_${GITHUB_SHA}" >> $GITHUB_ENV
          echo "TAG_LATEST=dev_latest" >> $GITHUB_ENV

      - name: Test Tag
        run: |
          echo $TAG

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build (local only)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}-dev-cache:latest
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}-dev-cache:latest,mode=max
      
      - name: Scan Image with Anchore (Grype)
        id: scan
        uses: anchore/scan-action@v5
        env:
          GRYPE_CONFIG: .github/security/.grype.yaml
        continue-on-error: true
        with:
          image: ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }} 
          fail-build: true
          output-format: sarif
          output-file: anchore-results.sarif
          severity-cutoff: medium
          only-fixed: true
      
      - name: Upload Anchore Scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: anchore-results.sarif
          category: grype
    
      - name: Build and push
        if: ${{ steps.scan.outcome == 'success' }}
        run: |
          # push dev_SHA tag
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}

          # optionally gate dev_latest to main to avoid branch collisions
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}
          fi


  # update cahrt deployment
  deploy_chart:
    needs: [build]
    uses: CIROH-UA/tethysportal-ciroh/.github/workflows/helm_deploy.yml@main
    with:
      dry-run: false
    secrets: inherit
