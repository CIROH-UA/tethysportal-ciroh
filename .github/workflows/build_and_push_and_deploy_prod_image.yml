name: build_push_deploy_prod_image
# A release tag (e.g. v1.2.0) builds the portal image, pushes it as
# awiciroh/tethysapp-ciroh-portal:<tag> and :latest, and deploys that exact tag
# through helm_deploy (behind the production environment's approval).
on:
  push:
    tags:
      - '*'
env:
  DOCKER_HUB_ORG: awiciroh
  DOCKER_REPO: tethysapp-ciroh-portal

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'false'

      # The release tag itself, so the deployed image names its release (and the
      # dev_* cleanup in build_push_dev_image never touches it).
      - name: Set Tag
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "TAG_LATEST=latest" >> "$GITHUB_ENV"

      - name: Test Tag
        run: |
          echo "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}
          # Registry-backed layer cache on Docker Hub (persists across runs, no
          # 10 GB GHA-cache eviction). Shared with the dev build so both reuse
          # the same 'buildcache' tag; ignored by the dev_* cleanup script.
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Scan image with Anchore (Grype)
        id: scan
        uses: anchore/scan-action@v5
        env:
          GRYPE_CONFIG: .github/security/.grype.yaml
        with:
          image: ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          fail-build: true
          output-format: table
          severity-cutoff: high
          only-fixed: true

      # The portal ships no apps (each is its own image); check what it does ship.
      - name: Smoke test the portal
        run: |
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=tethys_portal.settings \
            -e TETHYS_SECRET_KEY=ci-smoke \
            -v ${{ github.workspace }}/dev/smoke_portal.py:/tmp/smoke_portal.py:ro \
            ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }} \
            /opt/conda/envs/tethys/bin/python /tmp/smoke_portal.py

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG }}
          docker push ${{ env.DOCKER_HUB_ORG }}/${{ env.DOCKER_REPO }}:${{ env.TAG_LATEST }}

  # update chart deployment
  deploy_chart:
    needs: [build]
    uses: ./.github/workflows/helm_deploy.yml
    with:
      image-tag: ${{ github.ref_name }}
      dry-run: false
    secrets: inherit
