name: app_update_pin
# Second half of an app update PR (see app_requests.yml): when
# build_push_app_images has built the app on an app-update/<key>-<issue> PR, pin
# the image it built (tagged with that commit) in deploy/<key>/values-prod.yaml.
# That push re-runs deploy_apps' dry run on the PR; nothing is rebuilt, since
# an overlay change doesn't go into the image.

on:
  workflow_run:
    workflows: [build_push_app_images]
    types: [completed]

permissions:
  contents: read

jobs:
  pin:
    # Only this repo's bot branches: workflow_run runs with this repo's secrets,
    # so a fork's branch named app-update/... must not get here.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'app-update/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check the token is configured
        env:
          HAS_TOKEN: ${{ secrets.APP_REQUEST_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::APP_REQUEST_TOKEN isn't set; see app_requests.yml."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.APP_REQUEST_TOKEN }}
          fetch-depth: 1
          submodules: 'false'

      - name: Find what the run built
        id: what
        run: |
          set -euo pipefail
          key=$(sed -nE 's#^app-update/(.+)-[0-9]+$#\1#p' <<<"$BRANCH")
          entry=$(yq -r '.env.APPS' .github/workflows/build_and_push_app_images.yml \
            | jq -c --arg k "$key" '.[] | select(.key == $k)')
          if [ -z "$key" ] || [ -z "$entry" ]; then
            echo "::error::$BRANCH doesn't name an app in APPS"; exit 1
          fi
          # The pin commit re-runs the build workflow, which builds nothing; only
          # a run whose job for this app succeeded produced an image to pin.
          built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            | jq -r --arg k "$key" '.jobs[] | select(.name == $k and .conclusion == "success") | .name' | sed -n 1p)
          if [ -z "$built" ]; then
            echo "Run $RUN_ID didn't build $key; nothing to pin."
            echo "pin=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::notice::$BRANCH moved past $SHA since the build; its own build will pin it."
            echo "pin=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          image="awiciroh/$(jq -r .repo <<<"$entry"):$SHA"
          docker manifest inspect "$image" > /dev/null
          { echo "pin=true"; echo "key=$key"; echo "image=$image"; } >> "$GITHUB_OUTPUT"

      - name: Pin the image and push
        if: steps.what.outputs.pin == 'true'
        env:
          KEY: ${{ steps.what.outputs.key }}
          IMAGE: ${{ steps.what.outputs.image }}
        run: |
          set -euo pipefail
          f="deploy/$KEY/values-prod.yaml"
          # A local chart (deploy/<key>/chart) nests the tethys-app values. yq finds
          # the tag's line and sed swaps its value, so the rest of the file (blank
          # lines, quoting, comments) stays exactly as written.
          tag='(.image.tag // .["tethys-app"].image.tag)'
          line=$(yq "$tag | line" "$f")
          if [ -z "$line" ] || [ "$line" = 0 ]; then echo "::error::No image tag in $f"; exit 1; fi
          sed -i -E "${line}s/^(\s*tag:\s*\"?)[^\"[:space:]]*/\1$SHA/" "$f"
          [ "$(yq -r "$tag" "$f")" = "$SHA" ] || { echo "::error::Couldn't pin $f"; exit 1; }
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Pin $KEY to the image built from ${SHA:0:7}"
          git push origin "HEAD:$BRANCH"
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --json number -q '.[0].number')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" \
              --body "Pinned \`$IMAGE\` in \`$f\`. \`deploy_apps\` is dry-running the upgrade; merge once it passes to deploy (after the production approval)."
          fi
