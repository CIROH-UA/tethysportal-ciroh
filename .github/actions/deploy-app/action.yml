name: deploy-app
description: >
  helm upgrade one standalone app (deploy/<app>) on ciroh-portal-prod and apply its
  ingress, or do both as a server-side dry run. Expects AWS_REGION, CLUSTER_NAME,
  NAMESPACE, TETHYS_APP_CHART, TETHYS_APP_CHART_VERSION and APPS_S3_ROLE_ARN in the
  job env.
inputs:
  app:
    description: App key (deploy/<app>)
    required: true
  dry-run:
    description: '"true" for a server-side dry run, "false" to deploy'
    required: true
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ env.AWS_REGION }}

    - uses: azure/setup-helm@v4
      with:
        version: 'v3.14.0'

    - name: Set up the cluster context
      shell: bash
      run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

    - name: Check the pinned image exists
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: |
        # A local chart nests the tethys-app values under tethys-app:.
        values="deploy/$APP/values-prod.yaml"
        image=$(yq -r '(.image // .["tethys-app"].image) | .repository + ":" + .tag' "$values")
        echo "Image: $image"
        # The cluster pulls through the ECR cache (<registry>/docker-hub/<repo>);
        # check the Docker Hub image behind it.
        image=${image#*.amazonaws.com/docker-hub/}
        if ! docker manifest inspect "$image" > /dev/null; then
          echo "::error::$image is not on Docker Hub. Point $values at a tag build_push_app_images built."
          exit 1
        fi

    - name: Link the app's service account to the apps S3 role
      shell: bash
      env:
        APP: ${{ inputs.app }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        # Every app runs as its own service account (serviceAccount.create: true,
        # named after the app), which gets read/write on
        # ciroh-portal-assets/apps/<app>/ through the shared apps role. Only sweml
        # may share the portal's ciroh-portal account: its data is in another AWS
        # account, whose role trusts only the portal's.
        values="deploy/$APP/values-prod.yaml"
        account='(.serviceAccount // .["tethys-app"].serviceAccount)'
        create=$(yq -r "$account | .create // \"unset\"" "$values")
        sa=$(yq -r "$account | .name // \"\"" "$values")
        if [ "$create" != "true" ]; then
          if [ "$APP" = sweml ] && [ "$sa" = ciroh-portal ]; then
            echo "Shares the portal's ciroh-portal service account"
            exit 0
          fi
          echo "::error::$values: give $APP its own service account (serviceAccount: {create: true, name: $APP}); see Files on S3 in the README"
          exit 1
        fi
        # The name decides the S3 folder, so an app can only have its own.
        if [ "$sa" != "$APP" ]; then
          echo "::error::$values: serviceAccount.name must be $APP (it names the app's S3 folder)"
          exit 1
        fi
        assoc=$(aws eks list-pod-identity-associations --cluster-name "$CLUSTER_NAME" \
          --namespace "$NAMESPACE" --service-account "$sa" \
          --query 'associations[0].associationId' --output text)
        if [ "$assoc" != "None" ]; then
          role=$(aws eks describe-pod-identity-association --cluster-name "$CLUSTER_NAME" \
            --association-id "$assoc" --query association.roleArn --output text)
          if [ "$role" != "$APPS_S3_ROLE_ARN" ]; then
            echo "::error::$NAMESPACE/$sa is linked to $role, not $APPS_S3_ROLE_ARN. An admin set that up; leave it or remove it by hand."
            exit 1
          fi
          echo "$sa is linked to the apps role (S3 folder apps/$sa/)"
        elif [ "$DRY_RUN" = "true" ]; then
          echo "The deploy will link $sa to the apps role (S3 folder apps/$sa/)"
        else
          aws eks create-pod-identity-association --cluster-name "$CLUSTER_NAME" \
            --namespace "$NAMESPACE" --service-account "$sa" --role-arn "$APPS_S3_ROLE_ARN" > /dev/null
          echo "Linked $sa to the apps role (S3 folder apps/$sa/)"
        fi
        [ "$DRY_RUN" = "true" ] && exit 0
        # Pods get Pod Identity credentials only if the link exists when they start,
        # and the provision job (a pre-upgrade hook) starts before Helm creates the
        # service account. Create it now with Helm's ownership marks so Helm adopts it.
        if ! kubectl -n "$NAMESPACE" get serviceaccount "$sa" > /dev/null 2>&1; then
          kubectl -n "$NAMESPACE" create serviceaccount "$sa"
          kubectl -n "$NAMESPACE" label serviceaccount "$sa" app.kubernetes.io/managed-by=Helm
          kubectl -n "$NAMESPACE" annotate serviceaccount "$sa" \
            meta.helm.sh/release-name="$APP" meta.helm.sh/release-namespace="$NAMESPACE"
        fi

    - name: helm upgrade
      shell: bash
      env:
        APP: ${{ inputs.app }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        if [ -d "deploy/$APP/chart" ]; then
          chart=(deploy/$APP/chart)
          helm dependency build "deploy/$APP/chart"
        else
          chart=("$TETHYS_APP_CHART" --version "$TETHYS_APP_CHART_VERSION")
        fi
        upgrade() {
          helm upgrade --install "$APP" "${chart[@]}" -n "$NAMESPACE" \
            -f "deploy/$APP/values-prod.yaml" --timeout 30m "$@"
        }
        if [ "$DRY_RUN" = "true" ]; then
          upgrade --dry-run=server > /dev/null
          echo "Dry run of $APP's upgrade passed"
          exit 0
        fi

        # The Dask operator builds the scheduler and workers when a DaskCluster is
        # created and applies only worker-count changes after that, so any other
        # spec change (image, resources, env, args) means recreating the cluster.
        # Compare the spec without the worker count before and after the upgrade.
        dask="$APP-dask"
        dask_spec() {
          kubectl -n "$NAMESPACE" get daskcluster "$dask" -o json 2>/dev/null \
            | jq -cS '.spec | del(.worker.replicas)' || true
        }
        before=$(dask_spec)
        upgrade
        after=$(dask_spec)
        if [ -n "$before" ] && [ "$before" != "$after" ]; then
          # Name the changed parts only; the spec holds env values.
          changed=$(jq -rn --argjson a "$before" --argjson b "$after" \
            '[$a, $b | keys[]] | unique | map(select($a[.] != $b[.])) | join(", ")')
          echo "$dask changed ($changed); recreating it"
          kubectl -n "$NAMESPACE" delete daskcluster "$dask" --wait --timeout=5m
          # Helm creates the missing DaskCluster again; then wait for the operator
          # to bring up the new scheduler.
          upgrade
          for _ in $(seq 60); do
            kubectl -n "$NAMESPACE" get deploy "$dask-scheduler" > /dev/null 2>&1 && break
            sleep 5
          done
          kubectl -n "$NAMESPACE" rollout status deploy "$dask-scheduler" --timeout=10m
        fi
        helm -n "$NAMESPACE" status "$APP" | head -8

    - name: Apply the ingress
      shell: bash
      env:
        APP: ${{ inputs.app }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        f="deploy/$APP/ingress.yaml"
        [ -f "$f" ] || { echo "No $f"; exit 0; }
        if [ "$DRY_RUN" = "true" ]; then
          kubectl apply --dry-run=server -f "$f"
        else
          kubectl apply -f "$f"
        fi
