version: 2.0
name:
apps: {}
settings:
  DEBUG: false

  ALLOWED_HOSTS:
    - localhost
    - 127.0.0.1

  STATIC_ROOT: /home/tethys/persist/static
  MEDIA_ROOT: /home/tethys/persist/media

  DATABASES:
    default:
      ENGINE: django.db.backends.postgresql
      NAME: tethys_platform
      USER: tethys_default
      HOST: postgres
      PORT: 5432
      CONN_MAX_AGE: 0

  CHANNEL_LAYERS:
    default:
      BACKEND: channels.layers.InMemoryChannelLayer

  TETHYS_PORTAL_CONFIG:
    ENABLE_OPEN_PORTAL: true
    BYPASS_TETHYS_HOME_PAGE: true

site_settings:
  GENERAL_SETTINGS:
    SITE_TITLE: CIROH Portal
    BRAND_TEXT: CIROH Portal
